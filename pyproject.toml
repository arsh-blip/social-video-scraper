[project]
name = "social-video-scraper"
version = "0.1.0"
description = "Multi-platform social media video scraper — download videos from Twitter/X, Instagram, TikTok, and Facebook"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]

[project.scripts]
svs = "social_video_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_video_scraper"]
